services:
  wyoming-whisper:
    image: linuxserver/faster-whisper:gpu
    container_name: wyoming-whisper
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - WHISPER_MODEL=small
      - WHISPER_LANG=en
      - WHISPER_BEAM=1
    volumes:
      - /home/neonvariant/docker/wyoming-whisper:/config
    ports:
      - "10300:10300"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  wyoming-piper:
    image: lscr.io/linuxserver/piper:latest
    container_name: wyoming-piper
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - PIPER_VOICE=en_US-libritts_r-medium
      - PIPER_LENGTH=0.95
      - PIPER_NOISE=0.667
      - PIPER_NOISEW=0.333
      - PIPER_SPEAKER=159
    volumes:
      - /home/neonvariant/docker/piper:/config
    ports:
      - "10200:10200"
    restart: unless-stopped
